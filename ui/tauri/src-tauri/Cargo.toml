[package]
name = "kinetic"
version = "0.1.0"
description = "Kinetic Control Center"
authors = []
edition = "2021"

# No [lib] section — desktop-only binary crate (lib.rs deleted after scaffold).

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri               = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell  = "2"
tauri-plugin-dialog = "2"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
